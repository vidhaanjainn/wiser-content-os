<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wiser OS" />
    <meta name="theme-color" content="#07080a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Wiser OS</title>
    <style>
      html,body{background:#07080a;margin:0}
      #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(60% 45% at 50% 42%,rgba(205,244,100,.09),transparent 70%),#07080a;transition:opacity .5s cubic-bezier(.22,1,.36,1),visibility .5s}
      #boot.done{opacity:0;visibility:hidden}
      #boot .wrap{display:flex;flex-direction:column;align-items:center;gap:22px}
      #boot svg{width:84px;height:84px;overflow:visible}
      #boot .w{fill:none;stroke:#cdf464;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:bootDraw 1.1s cubic-bezier(.65,0,.35,1) .1s forwards;filter:drop-shadow(0 0 10px rgba(205,244,100,.45))}
      #boot .d{fill:#cdf464;transform-origin:51px 41px;transform:scale(0);animation:bootPop .5s cubic-bezier(.34,1.56,.64,1) 1s forwards}
      #boot .bar{width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
      #boot .bar i{display:block;width:40%;height:100%;border-radius:2px;background:linear-gradient(90deg,transparent,#cdf464,transparent);animation:bootBar 1.1s ease-in-out infinite}
      @keyframes bootDraw{to{stroke-dashoffset:0}}
      @keyframes bootPop{to{transform:scale(1)}}
      @keyframes bootBar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#boot .w{animation:none;stroke-dashoffset:0}#boot .d{animation:none;transform:none}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="wrap">
        <svg viewBox="0 0 64 64"><path class="w" pathLength="100" d="M14 22 L22 42 L30 26 L38 42 L46 22"/><circle class="d" cx="51" cy="41" r="3.2"/></svg>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
