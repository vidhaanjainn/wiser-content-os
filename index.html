<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wiser OS" />
    <meta name="theme-color" content="#07080a" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" media="print" onload="this.media='all'" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Wiser OS</title>
    <style>
      html,body{background:#07080a;margin:0}
      #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(60% 45% at 50% 42%,rgba(205,244,100,.09),transparent 70%),#07080a;transition:opacity .5s cubic-bezier(.22,1,.36,1),visibility .5s}
      #boot.done{opacity:0;visibility:hidden}
      #boot .wrap{display:flex;flex-direction:column;align-items:center;gap:22px}
      #boot .mk{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;padding-bottom:8px;box-sizing:border-box;background:radial-gradient(120% 120% at 20% 10%,#e6ff9a,#cdf464 45%,#7fa61f);color:#07080a;font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:50px;line-height:1;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 18px 50px -10px rgba(205,244,100,.55);transform:scale(.6) rotate(-12deg);opacity:0;animation:bootIn .8s cubic-bezier(.34,1.56,.64,1) .1s forwards,bootGlow 2s ease-in-out .9s infinite}
      @keyframes bootIn{to{transform:none;opacity:1}}
      @keyframes bootGlow{50%{box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 18px 70px -6px rgba(205,244,100,.8)}}
      #boot .bar{width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
      #boot .bar i{display:block;width:40%;height:100%;border-radius:2px;background:linear-gradient(90deg,transparent,#cdf464,transparent);animation:bootBar 1.1s ease-in-out infinite}
      @keyframes bootBar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#boot .mk{animation:none;transform:none;opacity:1}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="wrap">
        <div class="mk">w</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
